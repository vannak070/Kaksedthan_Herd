# ==============================================================================
# Dedicated Nginx Server Block for livestock.kaksedthan.com
# Place in /etc/nginx/sites-available/default or /etc/nginx/conf.d/
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name livestock.kaksedthan.com;

    client_max_body_size 50M;

    # Backend Express API Routes
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3002/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend Next.js Application Routes & Next.js API Routes
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Default Fallback Block (Rejects kaksedthan.com, www.kaksedthan.com & unhandled hostnames)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}
